apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "postgres.fullname" . }}-test-connection"
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: pg-isready
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
      command:
        - sh
        - -c
        - pg_isready -h {{ include "postgres.fullname" . }} -p {{ .Values.service.port }} -U "$POSTGRES_USER" -d {{ .Values.auth.database | quote }}
      env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: {{ include "postgres.secretName" . }}
              key: {{ .Values.auth.usernameKey }}
