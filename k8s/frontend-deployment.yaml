apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: lumiere-frontend
          image: docker.io/ravinder50300/lumiere-frontend:v1.0.1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3000

          readinessProbe:
            httpGet:
              port: 3000
              path: /
            initialDelaySeconds: 20

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
