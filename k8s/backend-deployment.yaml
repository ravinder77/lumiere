apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: lumiere-backend
          image: docker.io/ravinder50300/lumiere-backend:v1.0.0
          envFrom:
            - secretRef:
                name: lumiere-app-secret
          ports:
            - containerPort: 4000

          readinessProbe:
            httpGet:
              path: /ready
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 10


