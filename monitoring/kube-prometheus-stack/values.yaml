fullnameOverride: prometheus

defaultRules:
  create: true
  rules:
    etcd: false
    kubeScheduler: false

alertmanager:
  enabled: true
  service:
    type: ClusterIP
  alertmanagerSpec:
    replicas: 1
    retention: 120h
    storage:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: standard
          resources:
            requests:
              storage: 2Gi

grafana:
  enabled: true

  defaultDashboardsEnabled: true
  defaultDashboardsTimezone: browser

  initChownData:
    securityContext:
      capabilities:
        add:
          - CHOWN
          - DAC_OVERRIDE
          - FOWNER
        drop:
          - ALL
      readOnlyRootFilesystem: false
      runAsNonRoot: false
      runAsUser: 0
      seccompProfile:
        type: RuntimeDefault

  persistence:
    enabled: true
    storageClassName: standard
    size: 2Gi

  service:
    type: ClusterIP

  serviceMonitor:
    enabled: true
    interval: 30s

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki-gateway.monitoring.svc.cluster.local
      editable: true
      jsonData:
        derivedFields:
          - name: TraceID
            matcherRegex: '"trace_id":"([a-f0-9]+)"'
            datasourceUid: tempo
            url: '$${__value.raw}'
            urlDisplayLabel: View trace
    - name: Tempo
      uid: tempo
      type: tempo
      access: proxy
      url: http://tempo.monitoring.svc.cluster.local:3200
      editable: true
      jsonData:
        nodeGraph:
          enabled: true
        search:
          hide: false
        tracesToLogsV2:
          datasourceUid: loki
          spanStartTimeShift: -5m
          spanEndTimeShift: 5m
          filterByTraceID: true
          filterBySpanID: false
          customQuery: true
          query: '{service_name="$${__span.tags.service.name}"} | trace_id="$${__trace.traceId}"'
        serviceMap:
          datasourceUid: prometheus


prometheusOperator:
  admissionWebhooks:
    patch:
      enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

prometheus:
  service:
    type: ClusterIP
  prometheusSpec:
    replicas: 1
    retention: 7d
    retentionSize: 8GB
    scrapeInterval: 30s
    evaluationInterval: 30s
    enableOTLPReceiver: true
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: standard
          resources:
            requests:
              storage: 10Gi
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true
