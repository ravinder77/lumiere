apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: lumiere
spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: lumiere-backend
          image: docker.io/ravinder50300/lumiere-backend:v1.0.3
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: lumiere-app-secret
          ports:
            - name: http
              containerPort: 4000

          readinessProbe:
            httpGet:
              path: /ready
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 20

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"

          securityContext:
            allowPrivilegeEscalation: false

