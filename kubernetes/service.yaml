apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: lumiere
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 3000
  type: ClusterIP

---

apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: lumiere
spec:
  selector:
    app: backend

  ports:
    - name: http
      port: 80
      targetPort: 4000

  type: ClusterIP

---

apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: lumiere
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
